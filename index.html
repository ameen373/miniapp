<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini App</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- AdsGram -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f5f5f5;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>🎁 احصل على مكافأة</h1>

  <p>اضغط على الزر لمشاهدة الإعلان.</p>

  <button id="adButton">
    📺 مشاهدة الإعلان
  </button>

  <div id="status"></div>

  <script>

    // =====================================
    // ضع Block ID الخاص بك هنا
    // =====================================

    const BLOCK_ID = "int-43797";


    // تهيئة AdsGram
    const AdController = window.Adsgram.init({
      blockId: BLOCK_ID
    });


    const button = document.getElementById("adButton");
    const status = document.getElementById("status");


    button.addEventListener("click", async () => {

      status.textContent = "جاري تحميل الإعلان...";

      try {

        await AdController.show();

        // الإعلان اكتمل في Reward
        status.textContent = "🎉 تمت مشاهدة الإعلان! حصلت على المكافأة.";

      } catch (error) {

  console.error("AdsGram error:", error);

  status.textContent =
    "حدث خطأ: " + JSON.stringify(error);

      }

    });

  </script>

</body>
</html>
